name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Test
        run: npm test

      # No database or secrets required: the connection pool is constructed
      # lazily, so nothing connects at import time.
      - name: Build
        run: npm run build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squared
          POSTGRES_PASSWORD: squared
          POSTGRES_DB: squared
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squared"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://squared:squared@localhost:5432/squared
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Proves every migration applies cleanly to an empty database, which is
      # what a production deploy actually does.
      - name: Apply migrations from scratch
        run: node scripts/migrate.mjs

      - name: Verify schema is in sync with migrations
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema.ts has changes with no matching migration."
            git status --porcelain drizzle/
            exit 1
          fi

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t squared:ci .

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false skips remote state, so this needs no AWS credentials
      # and runs on every PR at no cost.
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

  # Plans the real infrastructure against the real AWS account on every PR,
  # authenticating through GitHub's OIDC provider. No access key is stored in
  # this repository: the workflow exchanges a short-lived, repo-scoped GitHub
  # token for AWS credentials that expire in minutes. The role is read-only
  # and explicitly denied the ability to decrypt secrets.
  #
  # `plan` creates nothing and costs nothing.
  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    # Skipped on forks, which cannot be granted the role.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC subject claim
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PYEOF'
          import base64, json, sys
          part = sys.argv[1].split(".")[1]
          part += "=" * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          PYEOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Plan
        run: |
          terraform init -backend=false
          terraform plan -input=false -no-color
        env:
          # terraform.tfvars is gitignored, so plan-only stand-ins are used.
          # They affect an alarm address and an image tag, not the topology
          # the plan is checking.
          TF_VAR_image_tag: ci-plan
          TF_VAR_alert_email: ci@example.com
